name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint blog
        run: pnpm --filter blog run lint

      - name: Format check
        run: pnpm run format:check

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeCheck blog
        run: pnpm --filter blog exec tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build blog
        run: pnpm --filter blog run build
        env:
          VITE_BASE_URL: /

      - name: Build knowledge-base
        run: pnpm --filter knowledge-base run build
        env:
          VITEPRESS_BASE: /kb/
          VITEPRESS_BLOG_URL: /

      - name: Upload blog artifact
        uses: actions/upload-artifact@v5
        with:
          name: blog-dist
          path: apps/blog/dist
          retention-days: 1

      - name: Upload knowledge-base artifact
        uses: actions/upload-artifact@v5
        with:
          name: kb-dist
          path: apps/knowledge-base/.vitepress/dist
          retention-days: 1
